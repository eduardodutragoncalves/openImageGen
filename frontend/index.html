<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>openImageGen</title>
    <meta
      name="description"
      content="Console for FLUX image generation on your own GPUs: queue work, watch it run, and find everything you have made."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      THESIS: A console built on a visible construction grid, where every value
      sits in a cell you can see and the machine reports itself in the open.
      Refuses the category default: a centred prompt bar floating over rounded
      cards on a dark gradient.

      OWN-WORLD: Instrument-black ground under a persistent hairline grid.
      Regions are divided by 1px rules, never by boxes, shadows or radii.
      Crouwel blue arrives only as a flat plane on the live thing; amber marks a
      refusal, vermilion a failure. Archivo variable, expanded and heavy, builds
      monumental numerals; Martian Mono carries seeds, sizes and VRAM. A 45°
      diagonal is the recurring mark, slicing the active tab and the primary
      action.

      STORY: The operator sees what the machine is doing, queues more work
      without waiting for it, and can find any image ever made.

      FIRST VIEWPORT: A fixed status rail spans the top — wordmark, model plate,
      one VRAM tape per GPU, queue depth. Below it two columns on the same grid:
      compose at left, 380px, ending in a full-width blue GENERATE plane; at
      right the running job at monumental scale over the archive grid.

      FORM: Wim Crouwel gridded type specimen, taken as a challenger over the
      assigned glass-cockpit direction; candidate 6 of seven grounded worlds.
      Seed key 7f90fc40, direction scope, operate mode, code-led.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
